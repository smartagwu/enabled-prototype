<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply saved display preferences before first paint (mirrors applyDisplayPrefs in src/lib/display.ts).
      try {
        var d = JSON.parse(localStorage.getItem('enabled-prototype-state')).state.display
        var r = document.documentElement
        if (d.textSize) r.dataset.textSize = d.textSize
        if (d.highContrast) r.dataset.contrast = 'more'
        if (d.reduceMotion) r.dataset.motion = 'reduce'
        if (d.darkTheme) r.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Enabled — Community for people with disability</title>
    <meta
      name="description"
      content="Enabled is a community platform where people with disability connect, chat, join forums, and attend social events."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
